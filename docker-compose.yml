services:
  alexa-bridge:
    build: .
    container_name: alexa-bridge
    ports:
      - "8101:8000"
    environment:
      - TZ=Europe/Berlin
    # SKILL_JARVIS, SKILL_CLAUDE, HA_TOKEN, MEMORY_TOKEN, CLAUDE_RUNNER_URL, CLAUDE_RUNNER_TOKEN etc., see .env.example
    env_file: .env
    restart: unless-stopped
